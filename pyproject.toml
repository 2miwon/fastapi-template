[project]
name = "fastapi-template"
version = "0.1.0"
description = "FastAPI project template following zhanymkanov/fastapi-best-practices"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.146.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.5",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "deptry>=0.25.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# ruff replaces black, isort, flake8, unimport, pylint and bandit.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (unused imports/vars — replaces unimport)
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (security)
    "PL",       # pylint
    "ASYNC",    # blocking calls inside async code
    "FAST",     # FastAPI-specific rules
    "C4", "PIE", "RET", "SIM", "PTH", "T20", "DTZ", "ERA", "RUF",
]
ignore = [
    "B008",     # Depends() in defaults is idiomatic FastAPI
    "PLR0913",  # FastAPI routes legitimately take many dependencies
    "FAST003",  # path params are consumed by validation dependencies (e.g. valid_post_id)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert
    "S105", "S106", "S107",  # hardcoded test passwords
    "PLR2004",  # magic values in assertions
]
"alembic/env.py" = ["ERA001"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.deptry]
known_first_party = ["src"]

[tool.deptry.per_rule_ignores]
DEP002 = ["asyncpg", "pwdlib"]  # asyncpg: loaded by SQLAlchemy via URL; pwdlib extra pulls argon2
